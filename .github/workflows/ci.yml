name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Static and coverage gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned quality tools
        run: python -m pip install coverage==7.15.2 mypy==2.3.0 ruff==0.16.0

      - name: Check style
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Check strict types
        run: mypy src/reprobrief

      - name: Test with branch coverage
        run: |
          PYTHONPATH=src coverage run -m unittest discover -s tests
          coverage report

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install from checkout
        run: python -m pip install --no-deps .

      - name: Verify installation metadata
        run: python -m pip check

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Run installed CLI smoke checks
        run: |
          reprobrief --version
          reprobrief inspect --config examples/demos/success.json

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
